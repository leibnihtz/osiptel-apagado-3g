[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "portalosiptel3g"
version = "0.1.0"
description = "Deteccion de apagado 3G (refarming) por distrito usando datasets OSIPTEL 2023-2025"
requires-python = ">=3.9"
dependencies = [
  "pandas>=2.0",
  "numpy>=1.24"
]

[project.scripts]
portalosiptel3g = "portalosiptel3g.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
